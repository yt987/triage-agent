name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q

  eval:
    runs-on: ubuntu-latest
    needs: test
    # Only run the eval gate if an OpenAI key is configured as a repo secret —
    # the agent's reasoning calls the real model, so this costs a small amount
    # of API credit per run.
    if: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m app.eval.harness
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MOCK_MODE: "true"
